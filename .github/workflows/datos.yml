name: Datos y tablas

# Refresca resultados y posiciones y republica el sitio en GitHub Pages.
# No usa la API de Claude: no cuesta nada.
on:
  schedule:
    # Minutos corridos a proposito: GitHub retrasa y hasta descarta las
    # corridas programadas en la hora pico, que es el arranque de cada hora.
    #
    # Y las horas tambien estan elegidas: en Uruguay (UTC-3) se juega entre las
    # 9 y la medianoche, o sea de 12 a 3 UTC. A las 5 de la manana no hay nada
    # que refrescar, y cada corrida le cuesta pedidos al servidor de La Movida,
    # que mantienen voluntarios.
    - cron: "7,27,47 12-23 * * *"   # 9 a 21 en Uruguay: cada 20 minutos
    - cron: "7,27,47 0-2 * * *"     # 21 a 24 en Uruguay: cada 20 minutos
    - cron: "7 3-11 * * *"          # de madrugada y a la manana: una por hora
  push:
    branches: [main]        # cualquier cambio a mano republica el sitio
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write      # para commitear los datos nuevos
  pages: write         # para publicar en GitHub Pages
  id-token: write      # lo exige deploy-pages

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Traer resultados y recalcular tablas
        run: python scripts/datos.py
      - name: Tablas de Primera Division
        run: python scripts/primera.py
      - name: Generar el sitio
        run: python scripts/sitio.py
      - name: Guardar los cambios en el repo
        run: |
          git config user.name "mvdfutbol-bot"
          git config user.email "bot@users.noreply.github.com"
          git add datos
          git diff --staged --quiet && echo "sin cambios" && exit 0
          git commit -m "Tablas y resultados al $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Si alguien pusheo en el medio, se reintenta sobre lo nuevo en vez
          # de fallar la corrida entera. El unico archivo que choca de verdad es
          # el estado del monitor, y ahi la respuesta es sumar lo que vieron las
          # dos corridas, no elegir una.
          for intento in 1 2 3; do
            git push && exit 0
            git fetch origin main
            if ! git rebase origin/main; then
              if git diff --name-only --diff-filter=U | grep -qx datos/estado.json; then
                git show :2:datos/estado.json > ../una.json
                git show :3:datos/estado.json > ../otra.json
                python scripts/unir_estado.py ../una.json ../otra.json datos/estado.json
                git add datos/estado.json
              fi
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "quedan conflictos que no se resuelven solos"
                git rebase --abort
                exit 1
              fi
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
          done
          git push
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: publico
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
