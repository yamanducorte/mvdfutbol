name: Noticias

# Escucha los canales, filtra, escribe y publica.
# Esta es la unica parte que gasta API de Claude.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Cuantos transcriptos procesar como maximo"
        required: false
        default: "6"

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  escribir:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install --quiet --upgrade yt-dlp anthropic
      - name: Escuchar los canales
        run: python scripts/monitor.py
      - name: Filtrar y redactar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/redactor.py --limite ${{ github.event.inputs.limite || '8' }}
      - name: Generar el sitio
        run: python scripts/sitio.py
      - name: Avisar a los buscadores
        run: python scripts/avisar.py
      - name: Guardar los cambios en el repo
        run: |
          git config user.name "mvdfutbol-bot"
          git config user.email "bot@users.noreply.github.com"
          git add contenido datos publico
          git diff --staged --quiet && echo "sin novedades" && exit 0
          git commit -m "Notas nuevas al $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: publico
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
