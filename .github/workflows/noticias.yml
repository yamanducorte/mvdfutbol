name: Noticias

# Escucha los canales, filtra, escribe y publica.
# Esta es la unica parte que gasta API de Claude.
on:
  schedule:
    - cron: "38 * * * *"   # fuera de la hora pico y sin pisar a datos.yml
  workflow_dispatch:
    inputs:
      limite:
        description: "Cuantos transcriptos procesar como maximo"
        required: false
        default: "6"

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  escribir:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # yt-dlp necesita un motor de JavaScript para sacar algunos formatos de
      # YouTube; sin esto avisa que la extraccion esta deprecada y puede no
      # encontrar el audio.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Instalar dependencias
        run: pip install --quiet --upgrade yt-dlp anthropic faster-whisper
      # El modelo de Whisper pesa unos 250 MB. Guardado, no se vuelve a bajar.
      - name: Guardar el modelo de Whisper entre corridas
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-int8
      - name: Escuchar los canales
        run: python scripts/monitor.py
      - name: Filtrar y redactar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Linea editorial. No va en el repo porque el repo es publico.
          CLUBES_DE_LA_CASA: ${{ secrets.CLUBES_DE_LA_CASA }}
        run: python scripts/redactor.py --limite ${{ github.event.inputs.limite || '8' }}
      - name: Generar el sitio
        run: python scripts/sitio.py
      - name: Avisar a los buscadores
        run: python scripts/avisar.py
      - name: Guardar los cambios en el repo
        run: |
          git config user.name "mvdfutbol-bot"
          git config user.email "bot@users.noreply.github.com"
          git add contenido datos
          git diff --staged --quiet && echo "sin novedades" && exit 0
          git commit -m "Notas nuevas al $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Si alguien pusheo en el medio, se reintenta sobre lo nuevo en vez
          # de fallar la corrida entera. El unico archivo que choca de verdad es
          # el estado del monitor, y ahi la respuesta es sumar lo que vieron las
          # dos corridas, no elegir una.
          for intento in 1 2 3; do
            git push && exit 0
            git fetch origin main
            if ! git rebase origin/main; then
              if git diff --name-only --diff-filter=U | grep -qx datos/estado.json; then
                git show :2:datos/estado.json > ../una.json
                git show :3:datos/estado.json > ../otra.json
                python scripts/unir_estado.py ../una.json ../otra.json datos/estado.json
                git add datos/estado.json
              fi
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "quedan conflictos que no se resuelven solos"
                git rebase --abort
                exit 1
              fi
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
          done
          git push
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: publico
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
