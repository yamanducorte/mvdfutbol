name: Diagnostico (temporal)

# Prueba si YouTube deja bajar subtitulos desde las IPs de GitHub.
# Se corre a mano y despues se borra este archivo.
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install --quiet --upgrade yt-dlp
      - name: Video que SI funciono desde la maquina de casa
        run: |
          echo "=== listar subtitulos disponibles ==="
          yt-dlp --list-subs --no-warnings "https://www.youtube.com/watch?v=wxaUswFVnL4" || true
          echo "=== intentar bajarlos ==="
          yt-dlp --skip-download --write-auto-subs --sub-langs "es" --sub-format vtt \
            --sleep-subtitles 2 -o "prueba1.%(ext)s" \
            "https://www.youtube.com/watch?v=wxaUswFVnL4" || true
          ls -la prueba1* 2>/dev/null || echo "NO BAJO NADA"
      - name: Un video cualquiera, muy visto, para descartar que sea del canal
        run: |
          yt-dlp --skip-download --write-auto-subs --sub-langs "es" --sub-format vtt \
            --sleep-subtitles 2 -o "prueba2.%(ext)s" \
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ" || true
          ls -la prueba2* 2>/dev/null || echo "NO BAJO NADA"
